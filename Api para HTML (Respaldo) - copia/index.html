<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videos</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f3f4f6;
        color: #222;
        font-family: Arial, sans-serif;
      }

      header {
        padding: 16px;
        background: #222;
        color: white;
      }

      header a {
        color: white;
        text-decoration: none;
      }

      main {
        width: min(100% - 24px, 1100px);
        margin: 20px auto;
      }

      .formulario-comentarios {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      input,
      select,
      button {
        min-height: 40px;
        padding: 8px;
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 4px;
        background: #2457a7;
        color: white;
        cursor: pointer;
      }

      button:hover,
      .tarjeta-video:hover {
        transform: translateY(-2px);
      }

      .cuadricula-videos {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-top: 16px;
      }

      .tarjeta-video {
        overflow: hidden;
        border-radius: 6px;
        background: white;
        transition: transform 0.2s;
      }

      .tarjeta-video video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #111;
        object-fit: cover;
        cursor: pointer;
      }

      .tarjeta-video h2 {
        margin: 10px;
      }

      .distribucion-reproductor {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .reproductor {
        width: 100%;
        background: #111;
      }

      .video-recomendado {
        display: flex;
        gap: 10px;
        margin: 10px 0;
        color: inherit;
        text-decoration: none;
      }

      .video-recomendado video {
        width: 130px;
        aspect-ratio: 16 / 9;
        background: #111;
        object-fit: cover;
      }

      .comentario {
        margin: 10px 0;
        padding: 10px;
        background: white;
      }

      .formulario-comentarios input[name="texto"] {
        flex: 1;
        min-width: 180px;
      }

      @media (min-width: 650px) {
        .cuadricula-videos {
          grid-template-columns: repeat(2, 1fr);
        }

        .distribucion-reproductor {
          grid-template-columns: minmax(0, 2fr) minmax(250px, 1fr);
        }
      }

      @media (min-width: 900px) {
        .cuadricula-videos {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="./"><strong>Videos</strong></a>
    </header>
    <main>
      <section id="catalogo">
        <h1>Videos</h1>
        <div id="videos" class="cuadricula-videos"></div>
      </section>

      <section id="reproduccion" hidden>
        <div class="distribucion-reproductor">
          <div>
            <video id="reproductor" class="reproductor" controls></video>
            <h1 id="titulo"></h1>
            <section>
              <h2>Comentarios</h2>
              <form id="formulario-comentarios" class="formulario-comentarios">
                <input name="nombre" maxlength="60" placeholder="Tu nombre" />
                <input name="texto" maxlength="500" placeholder="Escribe un comentario" />
                <button type="submit">Comentar</button>
              </form>
              <div id="comentarios"></div>
            </section>
          </div>
          <aside>
            <h2>Videos recomendados</h2>
            <div id="recomendaciones"></div>
          </aside>
        </div>
      </section>
    </main>

    <script>
      const API = "http://127.0.0.1:8000";
      async function consultar(ruta, opciones) {
        const respuesta = await fetch(API + ruta, opciones);
        return respuesta.status === 204 ? null : respuesta.json();
      }

      function obtenerFuenteVideo(fuente) {
        if (!fuente.startsWith("s3://")) return fuente;
        const [bucket, ...partes] = fuente.slice(5).split("/");
        const key = partes.map(encodeURIComponent).join("/");
        return `https://${bucket}.s3.us-east-2.amazonaws.com/${key}`;
      }

      function crearTarjeta(video) {
        const tarjeta = document.createElement("article");
        tarjeta.className = "tarjeta-video";
        const titulo = document.createElement("h2");
        titulo.textContent = video.titulo;
        const reproductor = document.createElement("video");
        reproductor.src = obtenerFuenteVideo(video.source);
        reproductor.controls = true;
        reproductor.preload = "metadata";
        reproductor.addEventListener("click", () => {
          location.href = `?video=${video.id}`;
        });

        tarjeta.append(titulo, reproductor);
        return tarjeta;
      }

      async function cargarCatalogo() {
        const videos = await consultar("/videos/");
        const cuadricula = document.querySelector("#videos");
        cuadricula.replaceChildren();
        videos.forEach((video) => cuadricula.append(crearTarjeta(video)));
      }

      async function cargarComentarios(idVideo) {
        const comentarios = await consultar(`/videos/${idVideo}/comentarios`);
        const lista = document.querySelector("#comentarios");
        lista.replaceChildren();
        comentarios.forEach((comentario) => {
          const elemento = document.createElement("article");
          elemento.className = "comentario";
          const nombre = document.createElement("strong");
          nombre.textContent = comentario.nombre;
          const texto = document.createElement("p");
          texto.textContent = comentario.texto;
          const eliminar = document.createElement("button");
          eliminar.type = "button";
          eliminar.textContent = "Eliminar";
          eliminar.addEventListener("click", async () => {
            await consultar(`/videos/comentarios/${comentario.id}`, { method: "DELETE" });
            await cargarComentarios(idVideo);
          });
          elemento.append(nombre, texto, eliminar);
          lista.append(elemento);
        });
      }

      async function cargarReproductor(idVideo) {
        const video = await consultar(`/videos/${idVideo}`);
        document.querySelector("#catalogo").hidden = true;
        document.querySelector("#reproduccion").hidden = false;
        document.querySelector("#reproductor").src = obtenerFuenteVideo(video.source);
        document.querySelector("#titulo").textContent = video.titulo;

        const recomendados = await consultar(`/videos/${idVideo}/recomendaciones`);
        const lista = document.querySelector("#recomendaciones");
        lista.replaceChildren();
        recomendados.forEach((videoRecomendado) => {
          const enlace = document.createElement("a");
          enlace.className = "video-recomendado";
          enlace.href = `?video=${videoRecomendado.id}`;
          const vistaPrevia = document.createElement("video");
          vistaPrevia.src = obtenerFuenteVideo(videoRecomendado.source);
          vistaPrevia.muted = true;
          vistaPrevia.preload = "metadata";
          const titulo = document.createElement("span");
          titulo.textContent = videoRecomendado.titulo;
          enlace.append(vistaPrevia, titulo);
          lista.append(enlace);
        });
        await cargarComentarios(idVideo);
      }

      const idVideo = new URLSearchParams(location.search).get("video");
      document.querySelector("#formulario-comentarios").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const formulario = evento.currentTarget;
        const datos = Object.fromEntries(new FormData(formulario));
        if (!datos.nombre.trim() || !datos.texto.trim()) return;
        await consultar(`/videos/${idVideo}/comentarios`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos),
        });
        formulario.reset();
        await cargarComentarios(idVideo);
      });

      idVideo ? cargarReproductor(idVideo) : cargarCatalogo();
    </script>
  </body>
</html>
